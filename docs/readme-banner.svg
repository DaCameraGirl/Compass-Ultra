<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="Compass Ultra">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#12102a"/>
      <stop offset="100%" stop-color="#0d1b33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc8cff"/>
      <stop offset="100%" stop-color="#33d69f"/>
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#33d69f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="920" height="220" rx="18" fill="url(#bg)"/>
  <rect x="-200" y="0" width="240" height="220" rx="18" fill="url(#shimmer)" opacity="0.9">
    <animate attributeName="x" values="-240;920" dur="7s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="918" height="218" rx="17" fill="none" stroke="#bc8cff" stroke-width="2" opacity="0.35">
    <animate attributeName="opacity" values="0.35;0.65;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>
  
  <circle cx="96" cy="110" r="48" fill="rgba(188,140,255,0.06)" stroke="#bc8cff" stroke-width="2" opacity="0.6">
    <animate attributeName="r" values="48;52;48" dur="3s" repeatCount="indefinite"/>
  </circle>
  <polygon points="96,68 104,110 96,102 88,110" fill="#33d69f">
    <animateTransform attributeName="transform" type="rotate" values="0 96 110;12 96 110;-12 96 110;0 96 110" dur="4s" repeatCount="indefinite"/>
  </polygon>
  <circle cx="96" cy="110" r="6" fill="#bc8cff">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="170" y="92" fill="#f8fbff" font-family="Segoe UI, system-ui, sans-serif" font-size="38" font-weight="800">Compass Ultra</text>
  <text x="170" y="126" fill="#9db4d1" font-family="Segoe UI, system-ui, sans-serif" font-size="17" font-weight="500">Release intelligence for teams that ship behind feature flags.</text>
  <rect x="170" y="148" width="128" height="28" rx="14" fill="rgba(188,140,255,0.14)" stroke="#bc8cff66" stroke-width="1">
    <animate attributeName="opacity" values="1;0.75;1" dur="2.5s" begin="0s" repeatCount="indefinite"/>
  </rect>
  <text x="234" y="167" fill="#bc8cff" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">RELEASE INTEL</text>
  <rect x="310" y="148" width="128" height="28" rx="14" fill="rgba(188,140,255,0.14)" stroke="#33d69f66" stroke-width="1">
    <animate attributeName="opacity" values="1;0.75;1" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>
  </rect>
  <text x="374" y="167" fill="#33d69f" font-family="Segoe UI, system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">FEATURE FLAGS</text>
</svg>