name: Compass Ultra Release Gate
description: Check a Compass Ultra workspace and fail CI when release risk is too high.
inputs:
  api-url:
    description: Compass Ultra API base URL.
    required: false
    default: https://api.compass-ultra.com
  api-key:
    description: Compass Ultra API key.
    required: true
  workspace:
    description: Path to exported Compass Ultra workspace JSON.
    required: true
  fail-on:
    description: Risk threshold that fails the workflow. One of low, medium, high, critical.
    required: false
    default: high
outputs:
  result:
    description: Full Compass check response JSON.
    value: ${{ steps.compass-check.outputs.result }}
  decision:
    description: Compass release decision.
    value: ${{ steps.compass-check.outputs.decision }}
  riskLevel:
    description: Highest risk level detected by Compass.
    value: ${{ steps.compass-check.outputs.riskLevel }}
  failed:
    description: Whether the release gate failed.
    value: ${{ steps.compass-check.outputs.failed }}
  summary:
    description: Human-readable Compass check summary.
    value: ${{ steps.compass-check.outputs.summary }}
  findings:
    description: Compass findings JSON.
    value: ${{ steps.compass-check.outputs.findings }}
runs:
  using: composite
  steps:
    - id: compass-check
      name: Run Compass release gate
      shell: bash
      run: node "$GITHUB_ACTION_PATH/compass-check.mjs"
      env:
        COMPASS_API_URL: ${{ inputs.api-url }}
        COMPASS_API_KEY: ${{ inputs.api-key }}
        COMPASS_WORKSPACE: ${{ inputs.workspace }}
        COMPASS_FAIL_ON: ${{ inputs.fail-on }}
