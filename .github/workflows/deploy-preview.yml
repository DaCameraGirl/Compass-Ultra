name: Deploy Preview

on:
  pull_request:
    branches: [main]

jobs:
  release-gate:
    runs-on: ubuntu-latest
    name: Compass Ultra Release Gate
    steps:
      - uses: actions/checkout@v4

      - id: compass-check
        uses: ./.github/actions/compass-check
        with:
          api-key: ${{ secrets.COMPASS_API_KEY }}
          workspace: fixtures/compass-workspace.demo.json
          fail-on: high
        continue-on-error: true

      - uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request'
        env:
          COMPASS_RESULT: ${{ steps.compass-check.outputs.result || '{}' }}
        with:
          script: |
            let result = {};
            try {
              result = JSON.parse(process.env.COMPASS_RESULT || '{}');
            } catch (error) {
              result = {
                failed: true,
                markdown: 'Compass release gate completed, but result JSON could not be parsed.',
                parseError: String(error),
              };
            }
            const body = [
              '## Compass Ultra Release Gate',
              '',
              result.markdown || result.summary || 'Release gate completed.',
              '',
              result.failed
                ? '> ❌ **Release gate failed** — fix the flagged issues before merging.'
                : '> ✅ **Release gate passed** — safe to proceed.',
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  preview-build:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: compass-ultra-preview
          path: dist
