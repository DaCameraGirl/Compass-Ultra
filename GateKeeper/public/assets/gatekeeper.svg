<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
      @keyframes eye-glow {
        0%, 100% { filter: drop-shadow(0 0 4px #00ffff); }
        50% { filter: drop-shadow(0 0 8px #00ffff); }
      }
      .robot-body { animation: float 3s ease-in-out infinite; }
      .core-glow { animation: pulse-glow 2s ease-in-out infinite; }
      .eyes { animation: eye-glow 1.5s ease-in-out infinite; }
      .antenna { animation: float 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Glowing aura -->
  <circle cx="100" cy="140" r="95" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.2"/>
  <circle cx="100" cy="140" r="90" fill="none" stroke="#0088ff" stroke-width="0.5" opacity="0.15"/>

  <!-- Main body group -->
  <g class="robot-body">
    <!-- Left arm -->
    <rect x="35" y="90" width="18" height="70" rx="9" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
    <circle cx="44" cy="165" r="12" fill="#d0d0d0" stroke="#999" stroke-width="1"/>

    <!-- Right arm -->
    <rect x="147" y="90" width="18" height="70" rx="9" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
    <circle cx="156" cy="165" r="12" fill="#d0d0d0" stroke="#999" stroke-width="1"/>

    <!-- Main torso -->
    <rect x="60" y="70" width="80" height="90" rx="8" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>

    <!-- Chest core (the heart!) -->
    <g class="core-glow">
      <circle cx="100" cy="115" r="18" fill="none" stroke="#00ffff" stroke-width="2" opacity="0.8"/>
      <circle cx="100" cy="115" r="14" fill="#00ffff" opacity="0.3"/>
      <circle cx="100" cy="115" r="10" fill="#00ffff" opacity="0.6"/>
    </g>

    <!-- Chest details -->
    <rect x="85" y="125" width="30" height="2" rx="1" fill="#999" opacity="0.5"/>
    <rect x="85" y="130" width="30" height="2" rx="1" fill="#999" opacity="0.5"/>

    <!-- Left ear panel -->
    <rect x="50" y="65" width="14" height="24" rx="3" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
    <rect x="52" y="68" width="10" height="18" rx="2" fill="#d0d0d0" opacity="0.7"/>

    <!-- Right ear panel -->
    <rect x="136" y="65" width="14" height="24" rx="3" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
    <rect x="138" y="68" width="10" height="18" rx="2" fill="#d0d0d0" opacity="0.7"/>

    <!-- Head -->
    <circle cx="100" cy="50" r="28" fill="#f5f5f5" stroke="#999" stroke-width="1.5"/>

    <!-- Left eye -->
    <circle cx="87" cy="42" r="8" fill="#001a33" stroke="#00ffff" stroke-width="1"/>
    <g class="eyes">
      <circle cx="87" cy="42" r="5" fill="#00ffff" opacity="0.9"/>
      <circle cx="85" cy="40" r="2" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Right eye -->
    <circle cx="113" cy="42" r="8" fill="#001a33" stroke="#00ffff" stroke-width="1"/>
    <g class="eyes">
      <circle cx="113" cy="42" r="5" fill="#00ffff" opacity="0.9"/>
      <circle cx="111" cy="40" r="2" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Smile (warm and friendly!) -->
    <path d="M 87 58 Q 100 65 113 58" stroke="#666" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Antenna -->
    <g class="antenna">
      <line x1="100" y1="20" x2="100" y2="5" stroke="#00ffff" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
      <circle cx="100" cy="3" r="3" fill="#00ffff" opacity="0.9"/>
    </g>

    <!-- Legs -->
    <rect x="80" y="160" width="14" height="60" rx="7" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
    <rect x="106" y="160" width="14" height="60" rx="7" fill="#e8e8e8" stroke="#999" stroke-width="1"/>

    <!-- Feet -->
    <rect x="75" y="220" width="24" height="12" rx="4" fill="#d0d0d0" stroke="#999" stroke-width="1"/>
    <rect x="101" y="220" width="24" height="12" rx="4" fill="#d0d0d0" stroke="#999" stroke-width="1"/>

    <!-- Foot details -->
    <rect x="78" y="223" width="18" height="2" rx="1" fill="#999" opacity="0.4"/>
    <rect x="104" y="223" width="18" height="2" rx="1" fill="#999" opacity="0.4"/>
  </g>

  <!-- Shadow for depth -->
  <ellipse cx="100" cy="245" rx="45" ry="8" fill="#000000" opacity="0.1"/>
</svg>